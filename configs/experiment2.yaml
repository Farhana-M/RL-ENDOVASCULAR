    - name: "net_64_64"
      policy_kwargs:
        net_arch: [64, 64]
    - name: "lr_7.5e-4"
      learning_rate: 0.00075
    - name: "lr_1e-4"
      learning_rate: 0.0001


sac:
  tuning_config:
