ddpg:
  tuning_config:
    - name: "net_64_64"
      policy_kwargs:
        net_arch: [64, 64]
    - name: "lr_1e-4"
      learning_rate: 0.0001
    - name: "actor_lr_1e-4_critic_lr_1e-3"
      actor_lr: 0.0001
      critic_lr: 0.001

td3:
